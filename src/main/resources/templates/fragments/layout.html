<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Sello de Autor, Specialty Coffee Store</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Estilos M2 -->
    <link rel="stylesheet" th:href="@{/css/estilos.css}" />
</head>
<body>

<div th:fragment="overlay" class="bg-overlay"></div>

<header th:fragment="navbar">
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/catalogo"><strong>Sello de Autor,</strong> Specialty Coffee Store.</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item me-3">
                        <a class="nav-link" href="/catalogo">Catálogo</a>
                    </li>
                    <li class="nav-item me-3" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link text-warning" href="/admin/products">Administración</a>
                    </li>
                    <li class="nav-item me-3">
                        <a class="nav-link" href="/carrito">Carrito
                            <span id="cart-badge" class="badge bg-danger ms-1">0</span>
                        </a>
                    </li>
                    <li class="nav-item d-flex align-items-center ms-lg-3 mt-3 mt-lg-0">
                        <div sec:authorize="isAuthenticated()" class="text-light me-3">
                            Hola, <span sec:authentication="name" class="fw-bold text-accent">Usuario</span>
                        </div>
                        <a sec:authorize="isAnonymous()" href="/login" class="btn btn-outline-light me-2 btn-sm">Ingresar</a>
                        <a sec:authorize="isAnonymous()" href="/register" class="btn btn-warning btn-sm">Registrarse</a>
                        <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="m-0">
                            <button type="submit" class="btn btn-outline-danger btn-sm">Salir</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>

<footer th:fragment="footer" class="text-center text-white py-3 footer-custom mt-auto">
    <div class="container">
        <p class="mb-1">
            Sello de Autor, Specialty Coffee Store — Importación y venta de equipo barista
        </p>
        <small>&copy; 2025 Sello de Autor, Specialty Coffee Store. Todos los derechos reservados</small>
    </div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Js del carrito -->
    <script th:src="@{/js/cart.js}"></script>
</footer>

</body>
</html>
