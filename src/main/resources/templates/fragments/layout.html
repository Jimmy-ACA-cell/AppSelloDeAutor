<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Sello de Autor</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Inter', sans-serif; }
        .navbar-brand { font-weight: 700; color: #d4a373 !important; font-size: 1.5rem; }
        .navbar { background-color: #343a40; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .nav-link { color: #fefae0 !important; font-weight: 500; transition: color 0.3s; }
        .nav-link:hover { color: #d4a373 !important; }
        .btn-primary { background-color: #d4a373; border-color: #d4a373; transition: all 0.3s; }
        .btn-primary:hover { background-color: #ccd5ae; border-color: #ccd5ae; color: #283618; transform: translateY(-2px); }
        .card { border: none; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); transition: transform 0.3s ease; }
        .card:hover { transform: translateY(-5px); }
    </style>
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/catalogo">
            <i class="bi bi-cup-hot-fill me-2"></i>Café Sello de Autor
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/catalogo">Catálogo</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" href="/admin/products">Admin Productos</a>
                </li>
            </ul>
            <div class="d-flex align-items-center">
                <div sec:authorize="isAuthenticated()" class="text-light me-3">
                    Bienvenido, <span sec:authentication="name" class="fw-bold text-warning">Usuario</span>
                </div>
                <a sec:authorize="isAnonymous()" href="/login" class="btn btn-outline-light me-2">Ingresar</a>
                <a sec:authorize="isAnonymous()" href="/register" class="btn btn-primary">Registrarse</a>
                <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-outline-danger">Cerrar Sesión</button>
                </form>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
