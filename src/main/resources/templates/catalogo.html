<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Catálogo - Sello de Autor')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container mt-4 mb-5">
    <h2 class="mb-4" style="color:#283618; font-weight:800;">Nuestro Catálogo</h2>

    <div class="row row-cols-1 row-cols-md-3 g-4">
        <div class="col" th:each="producto : ${productos}">
            <div class="card h-100">
                <img th:if="${producto.imagenUrl != null and !producto.imagenUrl.isEmpty()}"
                     th:src="@{${producto.imagenUrl}}"
                     class="card-img-top" alt="Producto Imagen" style="object-fit: cover; height: 250px;">
                <img th:unless="${producto.imagenUrl != null and !producto.imagenUrl.isEmpty()}"
                     th:src="@{/assets/img/placeholder.png}"
                     class="card-img-top" alt="Producto Imagen" style="object-fit: cover; height: 250px;">

                <div class="card-body d-flex flex-column">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h5 class="card-title mb-0" th:text="${producto.nombreProducto}" style="font-weight: 700; color: #343a40;">Nombre</h4>
                            <span class="badge bg-warning text-dark fs-6" th:text="'$' + ${producto.precio}">$0.00</span>
                    </div>
                    <p class="text-muted mb-3" style="font-size: 0.9rem;" th:text="${producto.categoria.nombreCategoria}">Categoria</p>
                    <p class="card-text flex-grow-1" th:text="${producto.descripcion}">Descripción del producto...</p>

                    <div class="mt-auto pt-3 border-top d-flex justify-content-between align-items-center">
                        <small class="text-muted" th:text="'Stock: ' + ${producto.stock} + ' un.'">Stock: 0</small>
                        <button class="btn btn-sm btn-outline-success">
                            <i class="bi bi-cart-plus"></i> Añadir
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${productos == null or productos.isEmpty()}" class="col-12 text-center py-5">
            <i class="bi bi-box-seam display-1 text-muted mb-3"></i>
            <h4 class="text-muted">No hay productos disponibles por el momento.</h4>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
