<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Admin - Formulario de Producto')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container mt-4 mb-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card p-4 shadow-sm">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3 th:text="${producto.id == null ? 'Crear Nuevo Producto' : 'Editar Producto'}" style="color:#283618; font-weight:700;">Formulario</h3>
                    <a href="/admin/products" class="btn btn-outline-secondary btn-sm">Volver a la lista</a>
                </div>

                <form th:action="${producto.id == null ? '/admin/products/create' : '/admin/products/edit/' + producto.id}"
                      th:object="${producto}" method="post">

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="codigo" class="form-label fw-bold">Código SKU</label>
                            <input type="text" class="form-control" id="codigo" th:field="*{codigo}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="nombreProducto" class="form-label fw-bold">Nombre del Producto</label>
                            <input type="text" class="form-control" id="nombreProducto" th:field="*{nombreProducto}" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="descripcion" class="form-label fw-bold">Descripción</label>
                        <textarea class="form-control" id="descripcion" th:field="*{descripcion}" rows="3"></textarea>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label for="categoria_id" class="form-label fw-bold">Categoría</label>
                            <select class="form-select" id="categoria_id" name="categoria_id" required>
                                <option value="" disabled th:selected="${producto.categoria == null}">Seleccione una categoría</option>
                                <option th:each="cat : ${categorias}"
                                        th:value="${cat.id}"
                                        th:text="${cat.nombreCategoria}"
                                        th:selected="${producto.categoria != null and producto.categoria.id == cat.id}">
                                </option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="precio" class="form-label fw-bold">Precio</label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input type="number" step="0.01" class="form-control" id="precio" th:field="*{precio}" required>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <label for="stock" class="form-label fw-bold">Stock</label>
                            <input type="number" class="form-control" id="stock" th:field="*{stock}" required min="0">
                        </div>
                    </div>

                    <div class="row mb-4 align-items-center">
                        <div class="col-md-9">
                            <label for="imagenUrl" class="form-label fw-bold">URL de la Imagen</label>
                            <input type="url" class="form-control" id="imagenUrl" th:field="*{imagenUrl}" placeholder="https://...">
                        </div>
                        <div class="col-md-3 mt-4 pt-1">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="active" th:field="*{isActive}" th:checked="*{isActive}">
                                <label class="form-check-label fw-bold" for="active">Activo</label>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="/admin/products" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary" th:text="${producto.id == null ? 'Guardar Producto' : 'Actualizar Producto'}">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
