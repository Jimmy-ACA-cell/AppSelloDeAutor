<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Admin - Formulario de Producto')}"></head>
<body class="d-flex flex-column min-vh-100">

<!-- Overlay -->
<div th:replace="~{fragments/layout :: overlay}"></div>

<!-- Navbar -->
<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="py-5 flex-grow-1 d-flex align-items-center" style="margin-top: 70px;">
    <div class="container mt-4 mb-5 position-relative z-1">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card p-4 shadow-sm bg-dark bg-opacity-75 text-white border-0" style="border-radius:14px; backdrop-filter:blur(6px);">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h3 th:text="${producto.id == null ? 'Crear Nuevo Producto' : 'Editar Producto'}" class="fw-bold text-warning m-0">Formulario</h3>
                        <a href="/admin/products" class="btn btn-outline-light btn-sm fw-bold">Volver a la lista</a>
                    </div>

                    <form th:action="${producto.id == null ? '/admin/products/create' : '/admin/products/edit/' + producto.id}"
                          th:object="${producto}" method="post">

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="codigo" class="form-label fw-bold text-white">Código SKU</label>
                                <input type="text" class="form-control bg-dark border-secondary text-white" id="codigo" th:field="*{codigo}" required>
                            </div>
                            <div class="col-md-6">
                                <label for="nombreProducto" class="form-label fw-bold text-white">Nombre del Producto</label>
                                <input type="text" class="form-control bg-dark border-secondary text-white" id="nombreProducto" th:field="*{nombreProducto}" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="descripcion" class="form-label fw-bold text-white">Descripción</label>
                            <textarea class="form-control bg-dark border-secondary text-white" id="descripcion" th:field="*{descripcion}" rows="3"></textarea>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label for="categoria_id" class="form-label fw-bold text-white">Categoría</label>
                                <select class="form-select bg-dark border-secondary text-white" id="categoria_id" name="categoria_id" required>
                                    <option value="" disabled th:selected="${producto.categoria == null}">Seleccione una categoría</option>
                                    <option th:each="cat : ${categorias}"
                                            th:value="${cat.id}"
                                            th:text="${cat.nombreCategoria}"
                                            th:selected="${producto.categoria != null and producto.categoria.id == cat.id}">
                                    </option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label for="precio" class="form-label fw-bold text-white">Precio</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-dark border-secondary text-muted">$</span>
                                    <input type="number" step="0.01" class="form-control bg-dark border-secondary text-white" id="precio" th:field="*{precio}" required>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <label for="stock" class="form-label fw-bold text-white">Stock</label>
                                <input type="number" class="form-control bg-dark border-secondary text-white" id="stock" th:field="*{stock}" required min="0">
                            </div>
                        </div>

                        <div class="row mb-4 align-items-center">
                            <div class="col-md-9">
                                <label for="imagenUrl" class="form-label fw-bold text-white">URL de la Imagen</label>
                                <input type="url" class="form-control bg-dark border-secondary text-white" id="imagenUrl" th:field="*{imagenUrl}" placeholder="https://...">
                            </div>
                            <div class="col-md-3 mt-4 pt-1">
                                <div class="form-check form-switch d-flex align-items-center p-0">
                                    <input class="form-check-input ms-0 me-2 mt-0" type="checkbox" id="active" th:field="*{isActive}" th:checked="*{isActive}">
                                    <label class="form-check-label fw-bold text-white-50 ms-1" for="active">Activo</label>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top border-secondary">
                            <a href="/admin/products" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-warning fw-bold text-dark" th:text="${producto.id == null ? 'Guardar Producto' : 'Actualizar Producto'}">Guardar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
