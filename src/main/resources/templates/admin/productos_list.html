<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Admin - Lista de Productos')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container mt-4 mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 style="color:#283618; font-weight:800;">Administración de Productos</h2>
        <a href="/admin/products/create" class="btn btn-primary">
            <i class="bi bi-plus-circle me-1"></i> Nuevo Producto
        </a>
    </div>

    <div class="card p-0 shadow-sm overflow-hidden">
        <table class="table table-hover table-striped mb-0 text-center align-middle">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Código</th>
                <th>Nombre</th>
                <th>Categoría</th>
                <th>Precio</th>
                <th>Stock</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${productos}">
                <td th:text="${p.id}">1</td>
                <td th:text="${p.codigo}">COD</td>
                <td th:text="${p.nombreProducto}" class="fw-semibold">Nombre</td>
                <td th:text="${p.categoria.nombreCategoria}">Cat</td>
                <td th:text="'$' + ${p.precio}">$10</td>
                <td th:text="${p.stock}">10</td>
                <td>
                    <span th:if="${p.active}" class="badge bg-success">Activo</span>
                    <span th:unless="${p.active}" class="badge bg-secondary">Inactivo</span>
                </td>
                <td>
                    <div class="d-flex justify-content-center gap-2">
                        <a th:href="@{/admin/products/edit/{id}(id=${p.id})}" class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <form th:action="@{/admin/products/delete/{id}(id=${p.id})}" method="post"
                              onsubmit="return confirm('¿Está seguro de eliminar (desactivar) este producto?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </div>
                </td>
            </tr>
            <tr th:if="${productos.isEmpty()}">
                <td colspan="8" class="py-4 text-muted">No hay productos registrados.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
