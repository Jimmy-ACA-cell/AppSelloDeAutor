<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Admin - Lista de Productos')}"></head>
<body class="d-flex flex-column min-vh-100">

<!-- Overlay -->
<div th:replace="~{fragments/layout :: overlay}"></div>

<!-- Navbar -->
<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="py-5 flex-grow-1" style="margin-top: 70px;">
    <div class="container mt-4 mb-5 position-relative z-1">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-white fw-bold">Administración de Productos</h2>
            <a href="/admin/products/create" class="btn btn-warning fw-bold">
                <i class="bi bi-plus-circle me-1"></i> Nuevo Producto
            </a>
        </div>

        <div class="card p-0 shadow-sm overflow-hidden bg-dark bg-opacity-75 border-0" style="border-radius:14px; backdrop-filter:blur(6px);">
            <table class="table table-dark table-hover table-striped mb-0 text-center align-middle bg-transparent">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Código</th>
                    <th>Nombre</th>
                    <th>Categoría</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody class="table-group-divider">
                <tr th:each="p : ${productos}">
                    <td th:text="${p.id}">1</td>
                    <td th:text="${p.codigo}">COD</td>
                    <td th:text="${p.nombreProducto}" class="fw-semibold text-warning">Nombre</td>
                    <td th:text="${p.categoria.nombreCategoria}">Cat</td>
                    <td th:text="'$' + ${#numbers.formatDecimal(p.precio, 1, 'POINT', 0, 'COMMA')}">$10</td>
                    <td th:text="${p.stock}">10</td>
                    <td>
                        <span th:if="${p.isActive}" class="badge bg-success">Activo</span>
                        <span th:unless="${p.isActive}" class="badge bg-secondary">Inactivo</span>
                    </td>
                    <td>
                        <div class="d-flex justify-content-center gap-2">
                            <a th:href="@{/admin/products/edit/{id}(id=${p.id})}" class="btn btn-sm btn-outline-info">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/admin/products/delete/{id}(id=${p.id})}" method="post"
                                  onsubmit="return confirm('¿Está seguro de eliminar (desactivar) este producto?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${productos.isEmpty()}">
                    <td colspan="8" class="py-4 text-white-50">No hay productos registrados.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
