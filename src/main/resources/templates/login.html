<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Iniciar Sesión - Sello de Autor')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card p-4">
                <h3 class="text-center mb-4 font-weight-bold" style="color:#d4a373;">Iniciar Sesión</h3>

                <div th:if="${param.error}" class="alert alert-danger">
                    Credenciales inválidas. Por favor intente de nuevo.
                </div>
                <div th:if="${param.logout}" class="alert alert-success">
                    Sesión cerrada correctamente.
                </div>
                <div th:if="${param.success}" class="alert alert-success">
                    Registro exitoso. Ahora puede iniciar sesión.
                </div>

                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label">Correo Electrónico</label>
                        <input type="email" class="form-control" id="username" name="username" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">Ingresar</button>
                    </div>
                    <div class="text-center mt-3">
                        <span class="text-muted">¿No tienes cuenta?</span> <a href="/register" style="color:#d4a373;">Regístrate</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
